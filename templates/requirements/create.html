{% extends "base.html" %}

{% block title %}Create Requirement — AI Procurement{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

  <div>
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create Procurement Requirement</h1>
    <p class="text-xs text-slate-500 mt-1">Specify your item details and let our AI search for local and global suppliers</p>
  </div>

  <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Item Name *</label>
        <input type="text" name="item_name" required placeholder="e.g. Industrial Centrifugal Pump" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Category</label>
          <select name="category_id" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select Category...</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Search Scope</label>
          <select name="search_scope" id="scopeSelect" onchange="toggleRadius(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="global" selected>Global (Worldwide Exporters & Traders)</option>
            <option value="country">Country (Domestic Suppliers)</option>
            <option value="nearby">Nearby (Radius in KM)</option>
          </select>
        </div>
      </div>

      <div id="radiusDiv" class="hidden">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nearby Radius (KM)</label>
        <input type="number" name="radius_km" placeholder="e.g. 50" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Quantity *</label>
          <input type="number" step="0.01" name="quantity" required value="10" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Unit</label>
          <input type="text" name="unit" value="pieces" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Target Price (INR)</label>
          <input type="number" step="0.01" name="target_price" placeholder="45000" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Specifications & Technical Details</label>
        <textarea name="specifications" rows="3" placeholder="Provide standards, flow rate, pressure, material grade, certifications required..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
        <a href="{% url 'requirements-list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
          Cancel
        </a>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition shadow-md shadow-blue-500/20 flex items-center">
          <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Search with AI
        </button>
      </div>
    </form>
  </div>

</div>

<script>
  function toggleRadius(val) {
    const div = document.getElementById('radiusDiv');
    if (val === 'nearby') {
      div.classList.remove('hidden');
    } else {
      div.classList.add('hidden');
    }
  }
</script>
{% endblock %}
